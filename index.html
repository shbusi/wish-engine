<style>

  #garden .muted { color:var(--muted); font-size:12px; margin-top:6px; line-height:1.45; } #garden .btn { margin-top:8px; } #garden .btn:disabled { opacity:.45; cursor:default; }
  #gardenMine { font-size:14px; line-height:1.5; }

  #garden .warn { font-size:12px; color:#ffd27a; margin-top:6px; line-height:1.4; } #garden .warn:empty { display:none; }
  #garden .row2 { display:flex; gap:8px; } #garden .row2 .btn { flex:1; margin-top:8px; }
  #garden .seeds { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } #garden .seeds button { background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--fg); border-radius:999px; padding:5px 10px; font:inherit; font-size:13px; cursor:pointer; }
  #garden .seeds button.on { border-color:var(--accent); color:var(--accent); } #garden .seeds button:disabled { opacity:.4; cursor:default; }

  #lore { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:16px; background:radial-gradient(ellipse at 50% 0%, rgba(20,70,90,.55), rgba(5,6,14,.85)); backdrop-filter: blur(6px); }
  #lore.show { display:flex; }

  #lore h2 { margin:0 0 10px; font-size:18px; letter-spacing:.02em; color:#9fe0ee; }
  #lore p { margin:0 0 10px; color:var(--fg); font-size:15px; line-height:1.55; }

  .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin-top:8px; }

  .buy { display:none; margin-top:8px; gap:8px; align-items:center; }

  .buy .btn { flex:1; }
  .celebrate { position:fixed; inset:0; pointer-events:none; background: radial-gradient(circle at 50% 40%, rgba(240,179,91,.35), transparent 60%); opacity:0; transition: opacity .4s; }
  .celebrate.show { opacity:1; }
  .iconbtn { background:var(--glass); backdrop-filter: blur(14px); border:1px solid var(--line); color:var(--fg); border-radius:12px; padding:9px 12px; font:inherit; font-size:14px; cursor:pointer; }

  .sheet { position:fixed; left:0; right:0; bottom:0; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
  .card { max-width:560px; margin:0 auto; background:var(--glass); backdrop-filter: blur(18px); border:1px solid var(--line); border-radius:18px; padding:12px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  textarea, input { width:100%; background:rgba(0,0,0,.35); border:1px solid var(--line); border-radius:12px; padding:11px 12px; color:var(--fg); font:inherit; font-size:16px; }
  textarea { height:64px; resize:none; }
  textarea:focus, input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .btn { flex-shrink:0; background:var(--accent); color:#1b1408; border:0; border-radius:999px; padding:0 20px; font:inherit; font-weight:700; font-size:16px; cursor:pointer; min-height:44px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .hint { color:var(--muted); font-size:12px; min-height:16px; margin-top:6px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .after { display:none; gap:8px; margin-top:8px; }
  .after.show { display:flex; }
  .after .btn { flex:1; }

  #feed { position:fixed; top:0; right:0; bottom:0; width:min(360px, 92vw); background:var(--glass); backdrop-filter: blur(18px); border-left:1px solid var(--line); transform:translateX(100%); transition: transform .25s ease; padding: max(12px, env(safe-area-inset-top)) 12px 12px; overflow:auto; }
  #feed.open { transform:none; }
  #feed h2 { font-size:14px; margin:4px 0 10px; display:flex; justify-content:space-between; align-items:center; }
  #feed ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  #feed li { background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:12px; padding:9px 11px; font-size:14px; cursor:pointer; animation: fade .4s ease; }
  #feed li:hover { border-color: rgba(255,255,255,.3); }
  #feed li span { color:var(--muted); font-size:12px; margin-left:6px; }
  @keyframes fade { from { opacity:0; transform:translateY(-4px); } }

  #tip { position:fixed; pointer-events:none; transform:translate(-50%, calc(-100% - 14px)); background:rgba(14,13,24,.9); border:1px solid var(--line); border-radius:12px; padding:9px 12px; max-width:260px; font-size:14px; opacity:0; transition:opacity .15s; }
  #tip.show { opacity:1; }
  #tip em { color:var(--muted); font-style:normal; }
  #tip .bl { display:flex; align-items:center; gap:8px; margin-top:7px; font-size:13px; color:var(--accent); }
  #tip .bless { pointer-events:auto; background:var(--accent); color:#1b1408; border:0; border-radius:999px; padding:4px 10px; font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  #tip .bless:disabled { opacity:.6; cursor:default; }
  #feedList em { color:var(--muted); font-style:normal; }
  #tip small { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
  #tip:after { content:""; position:absolute; left:50%; bottom:-6px; width:10px; height:10px; background:rgba(14,13,24,.9); border-right:1px solid var(--line); border-bottom:1px solid var(--line); transform:translateX(-50%) rotate(45deg); }

  #loading { position:fixed; inset:0; display:grid; place-items:center; background:#0b0b16; color:var(--muted); font-size:14px; transition: opacity .6s; z-index:10; }
  #loading.gone { opacity:0; pointer-events:none; }

  .toast.show { opacity:1; }
</style>

<body>
<canvas id="c" aria-label="wish cairn 3D scene"></canvas>
<div id="loading" data-i18n="loading">Loading the cairn…</div>

<div class="hud top">
  <div class="brand">
    <h1>🪨 <span data-i18n="title">Wish Cairn</span> <small data-i18n="world" style="font-weight:400;color:var(--muted);font-size:12px;margin-left:4px">Under the Firmament</small></h1>
    <div class="height"><span id="height">0.00</span> m<small id="today"></small></div>
    <div class="goal"><i id="goalbar"></i></div>
    <div class="goaltext" id="goaltext"></div>
    <div class="goaltext" id="bandtext" style="color:var(--accent)"></div>
    <div class="goaltext" id="firmtext" style="color:#7fd3e6"></div>
    <div class="stats">
      <span><b id="total">0</b> <span data-i18n="stones">stones</span></span>
      <span><b id="watching">1</b> <span data-i18n="watching">here now</span></span>
    </div>
    <div class="goaltext" id="karmaline" style="color:#e9c46a"></div>
    <div class="goaltext" id="givingline" style="color:var(--muted)"></div>
    <div class="goaltext" id="weatherline" style="color:#9fc9e6"></div>
  </div>
  <div class="row" style="margin:0;gap:8px"><a class="iconbtn" id="investLink" href="/invest" style="display:none;text-decoration:none" data-i18n="invest">Invest</a><button class="iconbtn" id="gardenBtn" title="" aria-label="garden">🌱</button><button class="iconbtn" id="loreBtn" title="" aria-label="story">🌊</button><button class="iconbtn" id="feedBtn" data-i18n="recent">Recent wishes</button><select class="iconbtn" id="langSel" aria-label="language" style="background:rgba(14,13,24,.78);color:var(--fg);border:1px solid var(--line);font-size:13px;padding:6px 8px;border-radius:999px"></select></div>
</div>

<aside id="feed" aria-label="recent wishes">
  <h2><span data-i18n="recent">최근 소원</span> <button class="iconbtn" id="feedClose" aria-label="close">✕</button></h2>
  <ul id="feedList"></ul>
</aside>

<div id="tip" role="status"></div>
<div class="celebrate" id="celebrate"></div>
<div id="garden"><div class="box">
  <div class="h"><b data-i18n="gardenTitle">The garden at the foot of the tower</b><button class="x" id="gardenClose">✕</button></div>
  <div id="gardenMine"></div>
  <div class="bars" id="seedBars" style="display:none"><div><span data-i18n="health">Health</span><i><b id="healthBar"></b></i></div><div><span data-i18n="moisture">Soil water</span><i><b id="moistBar"></b></i></div></div>
  <div class="warn" id="seedWarn"></div>
  <div class="row2"><button class="btn" id="waterBtn"></button><button class="btn ghost" id="mulchBtn"></button></div>
  <div id="plantRow" style="display:none"><div class="muted" id="spotInfo"></div><div class="seeds" id="seedPick"></div><button class="btn ghost" id="plantBtn"></button></div>
  <div class="muted" id="gardenNote"></div>
</div></div>
<div id="ceremony"><div class="t" id="ceremonyTitle"></div><div class="s" id="ceremonySub"></div></div>
<div id="lore" role="dialog" aria-modal="true"><div class="box"><h2 data-i18n="loreTitle">Under the Firmament</h2><div id="loreText"></div><button class="btn" id="loreOk" data-i18n="begin">Stack a stone</button></div></div>
<div class="toast" id="toast"></div>

<div class="sheet">
  <form class="card" id="f">
    <textarea id="wish" maxlength="140" required placeholder="이루어지길 바라는 것을 적어주세요" data-i18n-ph="wishPh" aria-label="wish"></textarea>
    <div class="row">
      <input id="name" maxlength="20" placeholder="이름 (선택) · 돌에 새겨져요" data-i18n-ph="namePh" aria-label="name">
      <button class="btn" id="btn" type="submit" data-i18n="stack">돌 올리기</button>
    </div>
    <div class="hint"><span id="hint"></span><span id="len">0/140</span></div>
    <div class="meta"><span id="status" class="pill"></span><span id="seedPill" class="pill" style="display:none;cursor:pointer"></span><label class="pill" style="cursor:pointer;white-space:nowrap" id="sealLabel"><input type="checkbox" id="seal" style="margin:0 6px 0 0">🔏 <span data-i18n="seal">Seal it · 1 stone</span></label><span id="you"></span></div>
    <div class="meta" id="chainRow" style="display:none"><label class="pill" style="cursor:pointer"><input type="checkbox" id="onchain" style="margin:0 6px 0 0"> <span data-i18n="onchain">Stack on-chain (stablecoin, you keep the stone as an NFT)</span></label><select id="payToken" class="pill" style="display:none;background:#15131f;color:var(--fg);border-color:var(--line)"></select><span id="chainState"></span></div>
    <div class="buy" id="buy"><button type="button" class="btn" id="buyBtn"></button></div>
    <div class="after" id="after">
      <button type="button" class="btn ghost" id="mine" data-i18n="mine">내 돌 보기</button>
      <button type="button" class="btn ghost" id="share" data-i18n="share">링크 공유</button>
    </div>
  </form>
</div>

import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DecalGeometry } from "three/addons/geometries/DecalGeometry.js";

function makeStoneTexture(size = 512, seed = 1) {
  const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d");
  const img = x.createImageData(size, size), d = img.data;
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    const u = i / size * 6, v = j / size * 6;
    const n1 = noise.noise(u + seed * 7, v, seed) * 0.5 + 0.5, n2 = noise.noise(u * 4, v * 4, seed + 3) * 0.5 + 0.5, n3 = noise.noise(u * 16, v * 16, seed + 9) * 0.5 + 0.5;
    const vein = Math.pow(Math.abs(noise.noise(u * 1.5, v * 1.5, seed + 20)), 0.35);
    let l = 0.52 + (n1 - 0.5) * 0.22 + (n2 - 0.5) * 0.12 + (n3 - 0.5) * 0.08 - vein * 0.08;
    const warm = 0.06 * n1;
    const k = (j * size + i) * 4; d[k] = 255 * (l + warm * 0.6); d[k + 1] = 255 * (l + warm * 0.25); d[k + 2] = 255 * (l - warm * 0.3); d[k + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const tx = new THREE.CanvasTexture(c); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tx;
}
function makeGroundTexture(size = 512) {
  const c = document.createElement("canvas"); c.width = c.height = size; const x = c.getContext("2d");
  const img = x.createImageData(size, size), d = img.data;
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    const u = i / size * 8, v = j / size * 8;
    const m = noise.noise(u, v, 50) * 0.5 + 0.5, f = noise.noise(u * 6, v * 6, 60) * 0.5 + 0.5, g = noise.noise(u * 24, v * 24, 70) * 0.5 + 0.5;
    const moss = Math.pow(m, 1.6);
    const k = (j * size + i) * 4;
    d[k] = 255 * (0.22 + f * 0.1 + (1 - moss) * 0.08); d[k + 1] = 255 * (0.24 + moss * 0.18 + g * 0.06); d[k + 2] = 255 * (0.15 + f * 0.05); d[k + 3] = 255;

  return tx;
}

{

    if (!r.ok) throw new Error(j.error);

    // The SSE echo can land before this response; either way we end up with the same stone.
    mine = j.stone;
    const st = addStone(j.stone, true) ?? byId.get(j.stone.id); Object.assign(st.data, j.stone); total = j.total; updateHud(); // the SSE echo hides sealed text; keep the owner's copy
    st.glow = 3; focusStone = null; wake();
    wishEl.value = ""; $("len").textContent = "0/140"; $("seal").checked = false; hint.textContent = me?.karmaUi !== false ? `${t("done")} ${t("deed", giving?.name || "")}` : t("done"); $("after").classList.add("show");
    if (me?.karmaUi !== false) setTimeout(() => floatText(st, "☸ +1"), 900);
    if (me?.seed && me.seed.days === 0 && me.seed.waterings === 1 && me.placed === 1) setTimeout(() => toast(t("seedPlanted")), 2200);
    history.replaceState(null, "", `?s=${j.stone.id}`);
    try { localStorage.setItem("cairn_name", name); localStorage.setItem("cairn_mine", String(j.stone.id)); } catch {}
    wishEl.blur();
  } catch (e) { console.error("stack failed", e); hint.textContent = e.message === "rate_limited" ? t("rate") : e.message === "too_short" ? t("short") : e.message === "need_credits" ? ($("seal").checked && me?.freeNow ? t("needStonesSeal") : t("needStones")) : t("err"); }
  finally { btn.disabled = false; btn.textContent = t("stack"); updateWallet(); }
});
$("onchain").addEventListener("change", updateWallet);
$("buyBtn").addEventListener("click", async () => {
  $("buyBtn").disabled = true;
  try {
    const r = await fetch("/api/buy", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider: providers[0] }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    location.href = j.redirectUrl;
  } catch { toast(t("err")); $("buyBtn").disabled = false; }
});
$("mine").addEventListener("click", () => { const st = mine && byId.get(mine.id); if (st) focusOn(st); else toast(t("hidden", total - stones.length)); });
$("share").addEventListener("click", async () => {
  const url = `${location.origin}/?s=${mine?.id ?? ""}`;
  if (navigator.share) { try { await navigator.share({ title: t("title"), text: mine?.wish, url }); return; } catch {} }
  try { await navigator.clipboard.writeText(url); toast(t("copied")); } catch {}
});
try { nameEl.value = localStorage.getItem("cairn_name") || ""; } catch {}

// ================================================================== optional generated assets (skybox / stone texture / stone mesh)
async function loadAssets() {
  try {
    const m = await fetch("/assets/manifest.json").then((r) => r.json());
    const tl = new THREE.TextureLoader();
    if (m.skybox) {
      const sky = await tl.loadAsync(m.skybox); sky.mapping = THREE.EquirectangularReflectionMapping; sky.colorSpace = THREE.SRGBColorSpace;
      scene.environment = pmrem.fromEquirectangular(sky).texture; // lighting + reflections from the generated sky
      if (m.skyboxVisible) { scene.background = sky; scene.backgroundIntensity = 0.9; scene.getObjectByName("skydome").visible = false; }
    }
    if (m.stone?.albedo) {
      const rep = m.stone.repeat ?? 1; // < 1 shows a smaller patch of the texture per stone (reads as one surface, not a mosaic)
      const a = await tl.loadAsync(m.stone.albedo); a.wrapS = a.wrapT = THREE.RepeatWrapping; a.repeat.set(rep, rep); a.colorSpace = THREE.SRGBColorSpace; a.anisotropy = 8;
      stoneMat.map = a; stoneMat.bumpMap = a; stoneMat.bumpScale = 0.9; stoneMat.needsUpdate = true;
      if (m.stone.normal) { const n = await tl.loadAsync(m.stone.normal); n.wrapS = n.wrapT = THREE.RepeatWrapping; n.repeat.set(rep, rep); stoneMat.normalMap = n; stoneMat.normalScale.set(0.7, 0.7); stoneMat.bumpMap = null; }
      if (m.stone.roughness) { const r = await tl.loadAsync(m.stone.roughness); r.wrapS = r.wrapT = THREE.RepeatWrapping; r.repeat.set(rep, rep); stoneMat.roughnessMap = r; }
      for (const st of stones) { st.mesh.material.map = stoneMat.map; st.mesh.material.bumpMap = stoneMat.bumpMap; st.mesh.material.normalMap = stoneMat.normalMap; st.mesh.material.roughnessMap = stoneMat.roughnessMap; st.mesh.material.needsUpdate = true; }
    }
    const wrap = (t, rep = 1) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 8; return t; };
    if (m.skies?.some(Boolean)) { // one panorama per altitude band; the dome shader blends neighbours
      await Promise.all(m.skies.map(async (u, i) => { if (!u) return; const t = await tl.loadAsync(u); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.offset.x = -0.25; skyTex[i] = t; })); // the panorama's blended seam sits at u=0.5; shift it behind the default camera (+z)
      for (let i = 0; i < 6; i++) skyTex[i] ??= skyTex[i - 1] ?? skyTex.find(Boolean);
      if (!m.skybox && skyTex[0]) { const e = skyTex[0].clone(); e.mapping = THREE.EquirectangularReflectionMapping; e.needsUpdate = true; scene.environment = pmrem.fromEquirectangular(e).texture; }
      applyEnv(altShown);
    }
    if (m.stone?.variants) {
      const rep = m.stone.repeat ?? 0.55;
      await Promise.all(Object.entries(m.stone.variants).map(async ([k, v]) => { const map = wrap(await tl.loadAsync(v.albedo), rep); map.colorSpace = THREE.SRGBColorSpace; const normalMap = v.normal ? wrap(await tl.loadAsync(v.normal), rep) : null; stoneVariants[k] = { map, normalMap }; }));
      await load(); // rebuild the visible stones with their family textures
    }
    if (m.ground?.albedo) {
      const g = scene.getObjectByName("ground"); const a = wrap(await tl.loadAsync(m.ground.albedo), 36); a.colorSpace = THREE.SRGBColorSpace; g.material.map = a; g.material.color.set(0x6e7a6a); // darken: it is night
      if (m.ground.normal) { g.material.normalMap = wrap(await tl.loadAsync(m.ground.normal), 36); g.material.normalScale.set(0.4, 0.4); }
      g.material.needsUpdate = true;
    }
    if (m.stone?.model) {
      const gltf = await new GLTFLoader().loadAsync(m.stone.model); let geo = null;
      gltf.scene.traverse((o) => { if (o.isMesh && !geo) geo = o.geometry; });
      if (geo) { geo = geo.clone(); geo.computeBoundingBox(); const b = geo.boundingBox, c = new THREE.Vector3(); b.getCenter(c); geo.translate(-c.x, -c.y, -c.z); const s = b.getSize(new THREE.Vector3()); geo.scale(2 / s.x, 2 / s.y, 2 / s.z); stoneGeoBase = geo; await load(); }
    }
  } catch {}
}

// ================================================================== go
await Promise.all([load(), loadMe()]);
loadGarden();
if (!VIDEO) live();
$("loading").classList.add("gone");
{ let seen = false; try { seen = !!localStorage.getItem("cairn_lore_seen"); } catch {} if (!seen && !VIDEO && !new URLSearchParams(location.search).get("s")) setTimeout(showLore, 900); }
{ const qs = new URLSearchParams(location.search);
  if (qs.get("bought")) { toast(t("bought", pack?.stones ?? "")); history.replaceState(null, "", "/"); }
  if (qs.get("failed")) { toast(t("failed")); history.replaceState(null, "", "/"); } }
if (VIDEO) {
  controls.autoRotate = true; controls.autoRotateSpeed = 1.2;
  const cap = document.createElement("div"); cap.id = "vcap"; document.body.appendChild(cap);
  window.__video = {
    ready: false,
    step(dt) { vdt = dt; vnow += dt * 1000; tick(); },
    /** Drop a stone locally (nothing is sent to the server). */
    drop(name, wish = "") { const d = { id: lastId + 1, name: String(name ?? "").slice(0, 20), wish: String(wish), sealed: 0, blessings: 0, created_at: Date.now() }; today++; const st = addStone(d, true); if (st) { st.vy = -2; } return d.id; },
    caption(title, sub = "") { cap.innerHTML = `${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}`; cap.style.opacity = title ? "1" : "0"; },
    stats: () => ({ total, meters: (total * stoneCm) / 100 }),
    where() { const out = { cam: camera.position.toArray().map((v) => +v.toFixed(1)), target: controls.target.toArray().map((v) => +v.toFixed(1)) }; for (const n of ["moonDisc", "sunDisc", "moon", "sun"]) { const o = scene.getObjectByName(n); const v = o.position.clone().project(camera); out[n] = { px: +((v.x + 1) / 2 * innerWidth).toFixed(0), py: +((1 - v.y) / 2 * innerHeight).toFixed(0), z: +v.z.toFixed(3), vis: o.visible, op: +o.material.opacity.toFixed(2), sc: +o.scale.x.toFixed(1), pos: o.position.toArray().map((q) => +q.toFixed(0)) }; } return out; },
    ceremony(wallets = 1000) { altOverride = BANDS[4] + 1; altShown = BANDS[4]; startCeremony({ total, wallets, reward: 1, stone: stones.at(-1)?.data }); },
  };
  loadAssets().catch(() => {}).finally(() => { window.__video.ready = true; });
  tick();
} else { tick(); loadAssets(); }
if (new URLSearchParams(location.search).has("ceremony")) { altOverride = BANDS[4] + 1; setTimeout(() => startCeremony({ total, wallets: 1234, reward: 1, stone: stones.at(-1)?.data }), 1500); }
{ // deep link ?s=<id>: find that stone
  const s = Number(new URLSearchParams(location.search).get("s"));
  if (s) { const st = byId.get(s); if (st) setTimeout(() => focusOn(st), 600); else fetch(`/api/stones?id=${s}`).then((r) => r.ok ? r.json() : null).then((j) => j && toast(`“${j.stone.wish}” — ${t("hidden", total - stones.length)}`)); }
  try { const m = Number(localStorage.getItem("cairn_mine")); if (m) { mine = { id: m }; $("after").classList.add("show");
    const st = byId.get(m); if (st?.data.sealed && st.data.wish == null) fetch(`/api/stones?id=${m}`).then((r) => r.ok ? r.json() : null).then((j) => { if (j?.stone.wish != null) Object.assign(st.data, j.stone); }); } } catch {}
}

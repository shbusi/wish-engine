<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wish Cairn</title>
<meta name="description" content="One stone tower, stacked by everyone. Add a stone, make a wish.">
<meta name="theme-color" content="#0b0b16">
<style>

  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud { position:fixed; left:0; right:0; pointer-events:none; padding: max(12px, env(safe-area-inset-top)) 16px 0; }
  .hud > * { pointer-events:auto; }
  .top { top:0; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .brand { background:var(--glass); backdrop-filter: blur(14px); border:1px solid var(--line); border-radius:14px; padding:8px 12px; }
  .brand h1 { font-size:16px; margin:0; display:flex; align-items:center; gap:8px; }
  .brand .stats { color:var(--muted); font-size:12px; margin-top:2px; display:flex; gap:10px; }
  .brand .stats b { color:var(--accent); }
  .height { font-size:30px; font-weight:800; letter-spacing:-.02em; line-height:1; margin-top:6px; font-variant-numeric: tabular-nums; }
  .height small { font-size:13px; color:var(--muted); font-weight:500; margin-left:6px; }
  .goal { margin-top:6px; height:5px; background:rgba(255,255,255,.1); border-radius:999px; overflow:hidden; }
  .goal i { display:block; height:100%; width:0; background:linear-gradient(90deg,#f0b35b,#ffd99a); border-radius:999px; transition: width .6s ease; }
  .goaltext { color:var(--muted); font-size:11px; margin-top:4px; }
  .tag { position:fixed; transform:translate(-50%,-100%); pointer-events:none; background:rgba(14,13,24,.78); backdrop-filter: blur(8px); border:1px solid var(--line); color:var(--fg); border-radius:999px; padding:4px 10px; font-size:13px; font-weight:600; white-space:nowrap; opacity:0; transition:opacity .3s; }
  .tag.show { opacity:1; }
  .tag.mine { border-color: var(--accent); color: var(--accent); }
  .float { position:fixed; transform:translate(-50%,-50%); pointer-events:none; color:var(--accent); font-weight:800; font-size:22px; text-shadow:0 2px 12px rgba(0,0,0,.6); animation: rise 1.6s ease-out forwards; }
  @keyframes rise { 0% { opacity:0; transform:translate(-50%,-30%) scale(.8);} 15% { opacity:1; transform:translate(-50%,-50%) scale(1.1);} 100% { opacity:0; transform:translate(-50%,-160%) scale(1);} }
  .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin-top:8px; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
  .pill.free { color:#9fe0b0; border-color: rgba(159,224,176,.35); }
  .buy { display:none; margin-top:8px; gap:8px; align-items:center; }
  .buy.show { display:flex; }
  .buy .btn { flex:1; }
  .celebrate { position:fixed; inset:0; pointer-events:none; background: radial-gradient(circle at 50% 40%, rgba(240,179,91,.35), transparent 60%); opacity:0; transition: opacity .4s; }
  .celebrate.show { opacity:1; }
  .iconbtn { background:var(--glass); backdrop-filter: blur(14px); border:1px solid var(--line); color:var(--fg); border-radius:12px; padding:9px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .iconbtn:hover { border-color: rgba(255,255,255,.25); }

  .sheet { position:fixed; left:0; right:0; bottom:0; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
  .card { max-width:560px; margin:0 auto; background:var(--glass); backdrop-filter: blur(18px); border:1px solid var(--line); border-radius:18px; padding:12px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  textarea, input { width:100%; background:rgba(0,0,0,.35); border:1px solid var(--line); border-radius:12px; padding:11px 12px; color:var(--fg); font:inherit; font-size:16px; }

  .btn { flex-shrink:0; background:var(--accent); color:#1b1408; border:0; border-radius:999px; padding:0 20px; font:inherit; font-weight:700; font-size:16px; cursor:pointer; min-height:44px; }

  .toast.show { opacity:1; }
</style>

<body>
<canvas id="c" aria-label="wish cairn 3D scene"></canvas>
<div id="loading" data-i18n="loading">Loading the cairn…</div>

<div class="hud top">
  <div class="brand">
    <h1>🪨 <span data-i18n="title">Wish Cairn</span></h1>
    <div class="height"><span id="height">0.00</span> m<small id="today"></small></div>
    <div class="goal"><i id="goalbar"></i></div>
    <div class="goaltext" id="goaltext"></div>
    <div class="goaltext" id="bandtext" style="color:var(--accent)"></div>
    <div class="stats">
      <span><b id="total">0</b> <span data-i18n="stones">stones</span></span>
      <span><b id="watching">1</b> <span data-i18n="watching">here now</span></span>
    </div>
  </div>
  <div class="row" style="margin:0;gap:8px"><a class="iconbtn" id="investLink" href="/invest" style="display:none;text-decoration:none" data-i18n="invest">Invest</a><button class="iconbtn" id="feedBtn" data-i18n="recent">Recent wishes</button></div>
</div>

<aside id="feed" aria-label="recent wishes">
  <h2><span data-i18n="recent">최근 소원</span> <button class="iconbtn" id="feedClose" aria-label="close">✕</button></h2>
  <ul id="feedList"></ul>
</aside>

<div id="tip" role="status"></div>
<div class="celebrate" id="celebrate"></div>
<div class="toast" id="toast"></div>

<div class="sheet">
  <form class="card" id="f">
    <textarea id="wish" maxlength="140" required placeholder="이루어지길 바라는 것을 적어주세요" data-i18n-ph="wishPh" aria-label="wish"></textarea>
    <div class="row">
      <input id="name" maxlength="20" placeholder="이름 (선택) · 돌에 새겨져요" data-i18n-ph="namePh" aria-label="name">
      <button class="btn" id="btn" type="submit" data-i18n="stack">돌 올리기</button>
    </div>
    <div class="hint"><span id="hint"></span><span id="len">0/140</span></div>
    <div class="meta"><span id="status" class="pill"></span><span id="you"></span></div>
    <div class="meta" id="chainRow" style="display:none"><label class="pill" style="cursor:pointer"><input type="checkbox" id="onchain" style="margin:0 6px 0 0"> <span data-i18n="onchain">Stack on-chain (stablecoin, you keep the stone as an NFT)</span></label><select id="payToken" class="pill" style="display:none;background:#15131f;color:var(--fg);border-color:var(--line)"></select><span id="chainState"></span></div>
    <div class="buy" id="buy"><button type="button" class="btn" id="buyBtn"></button></div>
    <div class="after" id="after">
      <button type="button" class="btn ghost" id="mine" data-i18n="mine">내 돌 보기</button>
      <button type="button" class="btn ghost" id="share" data-i18n="share">링크 공유</button>
    </div>
  </form>
</div>

/** Register the wish with the server (hash + voucher), then stack on the contract. */
async function stackOnChain(wish, name) {
  const { ethers } = await ethersMod();
  const provider = await connectWallet();
  const signer = await provider.getSigner();
  const prep = await fetch("/api/chain/prepare", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wish, name, address: chainAddr, wantFree: !!me?.freeNow }) }).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
  if (prep.wallet) { me = prep.wallet; updateWallet(); }
  try { localStorage.setItem(`cairn_salt_${prep.wishHash}`, prep.salt); } catch {}
  const cairn = new ethers.Contract(chainCfg.stoneCairn, chainCfg.abi, signer);
  hint.textContent = t("chainBusy");
  let tx;
  if (prep.voucher) {
    tx = await cairn.stackFree(prep.wishHash, prep.name, BigInt(prep.voucher.nonce), prep.voucher.expires, prep.voucher.signature);
  } else {
    const tokenAddr = $("payToken").value || chainCfg.stables[0].address;
    const pay = new ethers.Contract(tokenAddr, chainCfg.erc20Abi, signer);
    const price = await cairn.priceOf(tokenAddr);
    if ((await pay.allowance(chainAddr, chainCfg.stoneCairn)) < price) await (await pay.approve(chainCfg.stoneCairn, price * 20n)).wait(); // approve 20 stones at once
    tx = await cairn.stackWith(tokenAddr, prep.wishHash, prep.name);
  }
  const rc = await tx.wait();
  const ev = rc.logs.map((l) => { try { return cairn.interface.parseLog(l); } catch { return null; } }).find((e) => e?.name === "Stacked");

}

      if (geo) { geo = geo.clone(); geo.computeBoundingBox(); const b = geo.boundingBox, c = new THREE.Vector3(); b.getCenter(c); geo.translate(-c.x, -c.y, -c.z); const s = b.getSize(new THREE.Vector3()); geo.scale(2 / s.x, 2 / s.y, 2 / s.z); stoneGeoBase = geo; await load(); }
    }
  } catch {}
}

// ================================================================== go
await Promise.all([load(), loadMe()]);
live();
$("loading").classList.add("gone");
{ const qs = new URLSearchParams(location.search);
  if (qs.get("bought")) { toast(t("bought", pack?.stones ?? "")); history.replaceState(null, "", "/"); }
  if (qs.get("failed")) { toast(t("failed")); history.replaceState(null, "", "/"); } }
tick();
loadAssets();
{ // deep link ?s=<id>: find that stone
  const s = Number(new URLSearchParams(location.search).get("s"));
  if (s) { const st = byId.get(s); if (st) setTimeout(() => focusOn(st), 600); else fetch(`/api/stones?id=${s}`).then((r) => r.ok ? r.json() : null).then((j) => j && toast(`“${j.stone.wish}” — ${t("hidden", total - stones.length)}`)); }
  try { const m = Number(localStorage.getItem("cairn_mine")); if (m) { mine = { id: m }; $("after").classList.add("show"); } } catch {}
}

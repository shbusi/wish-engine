<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소원 돌탑</title>
<meta name="description" content="모두가 함께 쌓는 소원 돌탑. 돌 하나 올리고 소원을 빌어요.">
<style>
  :root { --bg:#0b0a12; --fg:#f3efe6; --muted:#a39d90; --accent:#f0b35b; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .stats { display:flex; gap:16px; color:var(--muted); font-size:13px; margin-top:6px; }
  .stats b { color: var(--accent); font-weight: 700; }
  #sky { display:block; width:100%; height:auto; margin: 18px 0 10px; border-radius: 16px; background: radial-gradient(ellipse at 50% 85%, #2a2235 0%, #0b0a12 65%); }
  form { display:grid; gap:8px; }
  textarea, input { width:100%; background:#15131f; border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px; color:var(--fg); font: inherit; font-size:16px; }
  textarea { min-height: 72px; resize: vertical; }
  textarea:focus, input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; gap:8px; }
  button { flex-shrink:0; background:var(--accent); color:#1b1408; border:0; border-radius:999px; padding:0 22px; font:inherit; font-weight:700; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--muted); font-size:12px; min-height: 16px; }
  ul { list-style:none; padding:0; margin: 24px 0 0; display:grid; gap:6px; }
  li { background:#15131f; border:1px solid rgba(255,255,255,.07); border-radius:12px; padding:10px 12px; font-size:15px; animation: fade .5s ease; }
  li span { color:var(--muted); font-size:12px; margin-left:8px; }
  @keyframes fade { from { opacity:0; transform: translateY(-4px);} }
  @keyframes drop { 0% { transform: translateY(-260px); } 70% { transform: translateY(6px);} 85% { transform: translateY(-3px);} 100% { transform: translateY(0);} }
  .drop { animation: drop .9s cubic-bezier(.2,.8,.3,1); }
  text { font-family: inherit; font-weight: 700; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>🪨 소원 돌탑 <small data-i18n="sub">모두가 함께 쌓는 탑</small></h1>
  <div class="stats">
    <span><b id="total">0</b> <span data-i18n="stones">개의 돌</span></span>
    <span><b id="watching">1</b> <span data-i18n="watching">명이 보고 있어요</span></span>
  </div>

  <svg id="sky" viewBox="0 0 560 420" role="img" aria-label="stone cairn"></svg>

  <form id="f">
    <textarea id="wish" maxlength="140" required placeholder="이루어지길 바라는 것을 적어주세요" data-i18n-ph="wishPh"></textarea>
    <div class="row">
      <input id="name" maxlength="20" placeholder="이름 (선택)" data-i18n-ph="namePh">
      <button id="btn" type="submit" data-i18n="stack">돌 올리기</button>
    </div>
    <div class="hint" id="hint"></div>
  </form>

  <ul id="feed"></ul>
</main>

<script>
const T = {
  ko: { sub:"모두가 함께 쌓는 탑", stones:"개의 돌", watching:"명이 보고 있어요", wishPh:"이루어지길 바라는 것을 적어주세요", namePh:"이름 (선택)", stack:"돌 올리기", stacking:"올리는 중…", done:"돌이 올라갔어요. 당신의 소원은 이제 탑의 일부예요.", short:"소원이 너무 짧아요.", rate:"잠시 후 다시 올려주세요.", err:"문제가 생겼어요. 다시 시도해주세요.", anon:"익명" },
  en: { sub:"one tower, stacked by everyone", stones:"stones", watching:"watching now", wishPh:"What do you hope for?", namePh:"Name (optional)", stack:"Stack a stone", stacking:"Stacking…", done:"Your stone is on the tower. Your wish is part of it now.", short:"Your wish is too short.", rate:"Please wait a moment before stacking again.", err:"Something went wrong. Please try again.", anon:"anonymous" },
};
const L = (navigator.language || "en").startsWith("ko") ? "ko" : "en";
const t = (k) => T[L][k];
document.documentElement.lang = L;
document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
document.querySelectorAll("[data-i18n-ph]").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));

// ---------- the tower ----------
const svg = document.getElementById("sky");
const W = 560, H = 420, VISIBLE = 16;   // stones drawn on screen; older ones become the base
let stones = [];                         // oldest → newest
let total = 0;
let lastId = 0;
const seed = (id) => { let s = (id * 9301 + 49297) % 233280; return () => (s = (s * 9301 + 49297) % 233280) / 233280; };
const colors = ["#857668", "#6b5f52", "#9a8b7a", "#7a6d5e", "#8c7f70"];

function render(newId) {
  const vis = stones.slice(-VISIBLE);
  const hidden = total - vis.length;
  let y = H - 36;
  let out = `<rect x="0" y="${H - 30}" width="${W}" height="30" fill="#2a2419"/>`;
  if (hidden > 0) { // base mound for the stones you can't see
    const h = Math.min(90, 18 + Math.log2(hidden + 1) * 10);
    out += `<path d="M${W/2-190},${H-30} Q${W/2},${H-30-h*2} ${W/2+190},${H-30} Z" fill="#3a3128"/>`;
    out += `<text x="${W/2}" y="${H-30-h*0.35}" font-size="11" fill="#a39d90" text-anchor="middle" font-weight="400">+${hidden.toLocaleString()}</text>`;
    y = H - 30 - h * 0.95;
  }
  vis.forEach((s, i) => {
    const r = seed(s.id);
    const w = 150 - i * 6 + (r() - .5) * 14, h = 22 - i * .4;
    const x = W / 2 + (r() - .5) * 14;
    y -= h - 2;
    const name = s.name ? (s.name.length > 10 ? s.name.slice(0, 9) + "…" : s.name) : "";
    out += `<g class="${s.id === newId ? "drop" : ""}">
      <ellipse cx="${x}" cy="${y}" rx="${w/2}" ry="${h/2}" fill="${colors[s.id % colors.length]}" stroke="#3a3128"/>
      ${name ? `<text x="${x}" y="${y}" font-size="11" fill="#f3efe6" text-anchor="middle" dominant-baseline="middle">${esc(name)}</text>` : ""}
    </g>`;
  });
  svg.innerHTML = out;
  document.getElementById("total").textContent = total.toLocaleString();
}
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// ---------- feed ----------
const feed = document.getElementById("feed");
function addToFeed(s, top = true) {
  const li = document.createElement("li");
  li.innerHTML = `${esc(s.wish)}<span>— ${esc(s.name || t("anon"))}</span>`;
  top ? feed.prepend(li) : feed.append(li);
  while (feed.children.length > 30) feed.lastChild.remove();
}

function take(s, animate) {
  if (s.id <= lastId) return;
  lastId = s.id;
  stones.push(s);
  if (stones.length > 200) stones.shift();
  addToFeed(s);
}

// ---------- load + live ----------
async function load() {
  const r = await fetch("/api/stones?n=40").then((r) => r.json());
  total = r.total;
  stones = [];
  for (const s of r.stones) take(s);
  render();
}
function live() {
  const es = new EventSource("/api/events");
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === "stone") { total = e.total; take(e.stone); render(e.stone.id); }
    if (e.type === "presence" || e.type === "hello") document.getElementById("watching").textContent = e.watching;
    if (e.type === "hello" && e.total !== total) load();
  };
  es.onerror = () => setTimeout(load, 3000); // EventSource reconnects on its own; resync counts
}

// ---------- stacking ----------
const form = document.getElementById("f"), btn = document.getElementById("btn"), hint = document.getElementById("hint");
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const wish = document.getElementById("wish").value.trim(), name = document.getElementById("name").value.trim();
  if (wish.length < 2) return (hint.textContent = t("short"));
  btn.disabled = true; btn.textContent = t("stacking"); hint.textContent = "";
  try {
    const r = await fetch("/api/stones", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ wish, name }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    total = j.total; take(j.stone); render(j.stone.id);   // the SSE echo is ignored by id
    document.getElementById("wish").value = "";
    hint.textContent = t("done");
    try { localStorage.setItem("cairn_name", name); } catch {}
  } catch (e) {
    hint.textContent = e.message === "rate_limited" ? t("rate") : e.message === "too_short" ? t("short") : t("err");
  } finally { btn.disabled = false; btn.textContent = t("stack"); }
});
try { document.getElementById("name").value = localStorage.getItem("cairn_name") || ""; } catch {}

load().then(live);
</script>
</body>
</html>
